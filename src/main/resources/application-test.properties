spring.application.name=backend

# Credentials come from .env, like the prod profile, rather than being committed.
# The database name stays here because that is what distinguishes the profile, and
# it is not a secret; only the username and password are read from outside.
#
# The fallbacks exist so a fresh checkout can run the test profile against a
# default local MySQL without any setup. They are the well-known local defaults,
# not this installation's real credentials - which used to be committed here in
# plain text while .env existed for exactly this purpose.
spring.datasource.url=jdbc:mysql://localhost:3306/poultry_db_test?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DATASOURCE_USER:root}
spring.datasource.password=${DATASOURCE_PASSWORD:root}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
file.upload-dir=${DC_UPLOAD_PATH:C:/Users/mulan/Desktop/DC}
frontend.url=http://localhost:3000
