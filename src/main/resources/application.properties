spring.application.name=backend
#server.port=8081

# --- Which environment -------------------------------------------------------
# The active profile is set by RequiredProfileEnvironmentPostProcessor from the
# ENV variable, and startup fails if ENV is missing. It is NOT declared here.
#
# It used to read spring.profiles.active=${ENV:test}, and that default was a trap:
# a production start that forgot ENV would come up silently on the test profile,
# whose application-test.properties points at poultry_db_test. A day of trading
# would land in the test database with no error anywhere, and the first sign would
# be balances that did not match.
#
# Defaulting to prod instead only swaps which mistake is silent, and puts the
# worse one in the live books - a developer forgetting ENV would write test data
# into the real accounts. So there is no default: ENV must say which database is
# being opened.

# --- Local secrets -----------------------------------------------------------
# Load .env from the working directory if it is there. Its KEY=VALUE lines are
# valid .properties syntax, so Spring can read it directly and no dotenv library
# is needed. "optional:" means a deployment that supplies real environment
# variables - production - simply has no file to find and starts as before.
#
# Without this, JWT_SECRET lives in .env and nothing reads it, and the
# application dies on startup with "Could not resolve placeholder 'JWT_SECRET'".
spring.config.import=optional:file:./.env[.properties]

# JWT signing. JWT_SECRET must be a Base64-encoded key of at least 32 bytes,
# supplied through .env locally or a real environment variable in production.
# The empty default is deliberate: it hands the missing-key case to JWTUtils,
# which refuses to start with a message that says what to set, instead of an
# opaque placeholder-resolution failure. There is still no usable fallback key.
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- Messaging ---------------------------------------------------------------
# The Fast2SMS credentials were constants in SendSmsService - the API key in plain
# text, twice, committed since the baseline and still in git history. They come from
# .env now. The key needs rotating regardless: taking it out of the source does not
# take it out of the history.
#
# messaging.enabled is false on purpose, and not merely as a cautious default. With
# it off, every message is still written to message_outbox exactly as it would be
# sent - recipient, number, template, variables, and the message in full - and left
# PENDING. A day's messages can then be read before anything reaches a customer,
# which matters while 130 customer numbers are still wrong and one number is shared
# by seven customers.
messaging.enabled=${MESSAGING_ENABLED:false}
messaging.channel=${MESSAGING_CHANNEL:SMS}
messaging.max-attempts=${MESSAGING_MAX_ATTEMPTS:3}
messaging.batch-size=${MESSAGING_BATCH_SIZE:50}
messaging.dispatch-interval-ms=${MESSAGING_DISPATCH_INTERVAL_MS:120000}
messaging.dispatch-initial-delay-ms=${MESSAGING_DISPATCH_INITIAL_DELAY_MS:30000}

messaging.fast2sms.api-key=${FAST2SMS_API_KEY:}
messaging.fast2sms.sender-id=${FAST2SMS_SENDER_ID:SHLCKN}
messaging.fast2sms.sms-template-id=${FAST2SMS_SMS_TEMPLATE_ID:195555}
messaging.fast2sms.whatsapp-phone-number-id=${FAST2SMS_WA_PHONE_NUMBER_ID:}
messaging.fast2sms.whatsapp-sale-template-id=${FAST2SMS_WA_SALE_TEMPLATE_ID:12082}
messaging.fast2sms.whatsapp-payment-template-id=${FAST2SMS_WA_PAYMENT_TEMPLATE_ID:12083}
# The 8-variable daily summary. Blank until approved - see docs/whatsapp-templates.md.
# While blank, the daily WhatsApp message is queued and skipped with a reason rather
# than sent against the 3-variable template, which would be rejected for everyone.
messaging.fast2sms.whatsapp-daily-template-id=${FAST2SMS_WA_DAILY_TEMPLATE_ID:}

# --- Schema management -------------------------------------------------------
# Flyway owns the schema; Hibernate is set to validate in every profile and
# must never alter it. Schema changes go in a new versioned migration under
# src/main/resources/db/migration.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Databases that already contain the V1 schema are recorded as baselined
# instead of having V1 re-applied to them. On an empty schema V1 runs normally.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=baseline_schema
# Refuse to start on a checksum mismatch rather than silently diverging.
spring.flyway.validate-on-migrate=true

# --- JSON ------------------------------------------------------------------
# Treat an empty string as absent for typed fields. A cleared numeric input in
# the UI posts "" and would otherwise fail deserialization; the money rules
# treat null as zero.
spring.jackson.deserialization.accept-empty-string-as-null-object=true
