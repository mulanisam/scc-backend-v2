spring.application.name=backend
#server.port=8081

# --- Which environment -------------------------------------------------------
# The active profile is set by RequiredProfileEnvironmentPostProcessor from the
# ENV variable, and startup fails if ENV is missing. It is NOT declared here.
#
# It used to read spring.profiles.active=${ENV:test}, and that default was a trap:
# a production start that forgot ENV would come up silently on the test profile,
# whose application-test.properties points at poultry_db_test. A day of trading
# would land in the test database with no error anywhere, and the first sign would
# be balances that did not match.
#
# Defaulting to prod instead only swaps which mistake is silent, and puts the
# worse one in the live books - a developer forgetting ENV would write test data
# into the real accounts. So there is no default: ENV must say which database is
# being opened.

# --- Local secrets -----------------------------------------------------------
# Load .env from the working directory if it is there. Its KEY=VALUE lines are
# valid .properties syntax, so Spring can read it directly and no dotenv library
# is needed. "optional:" means a deployment that supplies real environment
# variables - production - simply has no file to find and starts as before.
#
# Without this, JWT_SECRET lives in .env and nothing reads it, and the
# application dies on startup with "Could not resolve placeholder 'JWT_SECRET'".
spring.config.import=optional:file:./.env[.properties]

# JWT signing. JWT_SECRET must be a Base64-encoded key of at least 32 bytes,
# supplied through .env locally or a real environment variable in production.
# The empty default is deliberate: it hands the missing-key case to JWTUtils,
# which refuses to start with a message that says what to set, instead of an
# opaque placeholder-resolution failure. There is still no usable fallback key.
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- Messaging ---------------------------------------------------------------
# The Fast2SMS credentials were constants in SendSmsService - the API key in plain
# text, twice, committed since the baseline and still in git history. They come from
# .env now. The key needs rotating regardless: taking it out of the source does not
# take it out of the history.
#
# messaging.enabled is false on purpose, and not merely as a cautious default. With
# it off, every message is still written to message_outbox exactly as it would be
# sent - recipient, number, template, variables, and the message in full - and left
# PENDING. A day's messages can then be read before anything reaches a customer,
# which matters while 130 customer numbers are still wrong and one number is shared
# by seven customers.
messaging.enabled=${MESSAGING_ENABLED:false}
messaging.channel=${MESSAGING_CHANNEL:SMS}
messaging.max-attempts=${MESSAGING_MAX_ATTEMPTS:3}
messaging.batch-size=${MESSAGING_BATCH_SIZE:50}
messaging.dispatch-interval-ms=${MESSAGING_DISPATCH_INTERVAL_MS:120000}
messaging.dispatch-initial-delay-ms=${MESSAGING_DISPATCH_INITIAL_DELAY_MS:30000}

messaging.fast2sms.api-key=${FAST2SMS_API_KEY:}
messaging.fast2sms.sender-id=${FAST2SMS_SENDER_ID:SHLCKN}
messaging.fast2sms.sms-template-id=${FAST2SMS_SMS_TEMPLATE_ID:195555}
messaging.fast2sms.whatsapp-phone-number-id=${FAST2SMS_WA_PHONE_NUMBER_ID:}
messaging.fast2sms.whatsapp-sale-template-id=${FAST2SMS_WA_SALE_TEMPLATE_ID:12082}
messaging.fast2sms.whatsapp-payment-template-id=${FAST2SMS_WA_PAYMENT_TEMPLATE_ID:12083}
# The daily summary template. Blank means the daily WhatsApp message is queued and
# skipped with a reason rather than sent against the 3-variable template, which would
# be rejected for every customer. See docs/whatsapp-templates.md.
#
# Two exist, and this must agree with whatsapp-daily-includes-rate below:
#   32367  daily_sale_no_rate  7 variables  (the default - no per-kilo rate)
#   32340  daily_sale_summary  8 variables  (includes the rate)
messaging.fast2sms.whatsapp-daily-template-id=${FAST2SMS_WA_DAILY_TEMPLATE_ID:}
# Off: the owner does not want the per-kilo rate on a customer's phone. Note that
# amount and weight are both still in the message, so the rate remains one division
# away - this keeps it off the screen, it does not make it confidential.
messaging.fast2sms.whatsapp-daily-includes-rate=${FAST2SMS_WA_DAILY_WITH_RATE:false}

# --- Schema management -------------------------------------------------------
# Flyway owns the schema; Hibernate is set to validate in every profile and
# must never alter it. Schema changes go in a new versioned migration under
# src/main/resources/db/migration.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Databases that already contain the V1 schema are recorded as baselined
# instead of having V1 re-applied to them. On an empty schema V1 runs normally.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=baseline_schema
# Refuse to start on a checksum mismatch rather than silently diverging.
spring.flyway.validate-on-migrate=true

# --- JSON ------------------------------------------------------------------
# Treat an empty string as absent for typed fields. A cleared numeric input in
# the UI posts "" and would otherwise fail deserialization; the money rules
# treat null as zero.
spring.jackson.deserialization.accept-empty-string-as-null-object=true

# --- Connection pool and JPA, for production ----------------------------------
# Both of these were reported by the application itself on every start, and both
# are real rather than cosmetic.
#
# open-in-view keeps a database connection bound to the request for as long as the
# response is being rendered, so a slow client holds a connection the whole time.
# Spring warns about it by default for that reason. Off means a lazy association
# touched outside a transaction fails loudly in testing instead of silently
# holding a connection in production - the trading entry response already had to be
# fixed for exactly that, and this makes the next one obvious.
spring.jpa.open-in-view=false

# max-lifetime was 20000 in every profile, which is below HikariCP's 30-second
# floor, so the pool logged "maxLifetime is less than 30000ms, setting to default"
# and quietly used 30 minutes. Stating 15 minutes means the configured value is the
# value in force, and it stays well under MySQL's own wait_timeout so the pool
# retires a connection before the server closes it underneath us.
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
# Names the pool's threads in the logs, so a connection problem says which pool.
spring.datasource.hikari.pool-name=scc-pool

# An upload larger than this is refused with 413 rather than filling the heap.
# The DC scans attached to a purchase are photographs, so 10 MB is generous.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB

# Return the reason a request was rejected, not just the status. Without this a 400
# arrives with an empty body and the screen can only guess.
server.error.include-message=always

# --- Response compression ----------------------------------------------------
# Every JSON response over 2 KB goes out gzipped. Measured on the customer list,
# which is the screen that prompted this:
#
#     /user/customers   225,227 bytes  ->  16,555 bytes   (93% smaller)
#
# JSON compresses this well because it is the same twenty field names repeated
# once per row. It costs a few milliseconds of CPU on a machine that is otherwise
# idle, and it applies to every large GET rather than to one endpoint - the ledger,
# the reports, the message log and the payables list all gain the same way.
#
# On localhost this saves little wall-clock time; over the office wifi, or any
# connection the business actually uses, it is the difference between one packet
# round and fifteen.
server.compression.enabled=true
server.compression.mime-types=application/json,application/problem+json,text/html,text/plain,text/css,application/javascript
# Below this it is not worth the CPU or the Content-Encoding header.
server.compression.min-response-size=2KB

# --- Weekly statement --------------------------------------------------------
# The Monday run that sends each customer the week just ended, as a PDF attached to
# a WhatsApp message. Off by default, and separately from messaging.enabled: this
# decides whether the statements are built, that one decides whether they are sent.
# With it on and messaging off, a week's statements can be read in the outbox before
# anything reaches a customer.
messaging.weekly-statement-enabled=${MESSAGING_WEEKLY_STATEMENT_ENABLED:false}
# 06:30 Monday, for Monday-to-Sunday of the week that just closed. A cron rather
# than a fixed delay, so a midweek restart cannot quietly move it to Wednesdays.
messaging.weekly-statement-cron=${MESSAGING_WEEKLY_STATEMENT_CRON:0 30 6 * * MON}
messaging.timezone=${MESSAGING_TIMEZONE:Asia/Kolkata}
# The media template carrying the PDF. Registered as weekly_statement, id 32614,
# awaiting Meta approval - until then the run queues and holds with that reason.
messaging.fast2sms.whatsapp-statement-template-id=${FAST2SMS_WA_STATEMENT_TEMPLATE_ID:32614}
