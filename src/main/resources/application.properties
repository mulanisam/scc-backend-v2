spring.application.name=backend
#server.port=8081
spring.profiles.active=${ENV:test}

# --- Local secrets -----------------------------------------------------------
# Load .env from the working directory if it is there. Its KEY=VALUE lines are
# valid .properties syntax, so Spring can read it directly and no dotenv library
# is needed. "optional:" means a deployment that supplies real environment
# variables - production - simply has no file to find and starts as before.
#
# Without this, JWT_SECRET lives in .env and nothing reads it, and the
# application dies on startup with "Could not resolve placeholder 'JWT_SECRET'".
spring.config.import=optional:file:./.env[.properties]

# JWT signing. JWT_SECRET must be a Base64-encoded key of at least 32 bytes,
# supplied through .env locally or a real environment variable in production.
# The empty default is deliberate: it hands the missing-key case to JWTUtils,
# which refuses to start with a message that says what to set, instead of an
# opaque placeholder-resolution failure. There is still no usable fallback key.
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- Schema management -------------------------------------------------------
# Flyway owns the schema; Hibernate is set to validate in every profile and
# must never alter it. Schema changes go in a new versioned migration under
# src/main/resources/db/migration.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Databases that already contain the V1 schema are recorded as baselined
# instead of having V1 re-applied to them. On an empty schema V1 runs normally.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=baseline_schema
# Refuse to start on a checksum mismatch rather than silently diverging.
spring.flyway.validate-on-migrate=true

# --- JSON ------------------------------------------------------------------
# Treat an empty string as absent for typed fields. A cleared numeric input in
# the UI posts "" and would otherwise fail deserialization; the money rules
# treat null as zero.
spring.jackson.deserialization.accept-empty-string-as-null-object=true
