spring.application.name=backend

# Credentials from .env, as in the test and prod profiles. See the note in
# application-test.properties: the fallbacks are the well-known local defaults so
# a fresh checkout still runs, not this installation's real credentials.
spring.datasource.url=jdbc:mysql://localhost:3306/poultry_db_dev?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DATASOURCE_USER:root}
spring.datasource.password=${DATASOURCE_PASSWORD:root}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.datasource.hikari.max-lifetime=20000

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
file.upload-dir=${DC_UPLOAD_PATH:C:/Users/mulan/Desktop/DC}

frontend.url=http://localhost:3000
